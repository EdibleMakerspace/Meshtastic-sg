# GitHub Pages settings. In the repository: Settings → Pages → Source: "Deploy from a branch",
# Branch: main, Folder: /docs
title: Meshtastic LoRa mesh for Singapore
description: >-
  A beginner-friendly guide and open-source control panel for Meshtastic LoRa mesh radios
  in Singapore (SG_923, 917–925 MHz) on Windows: Seeed XIAO ESP32S3 setup, Paxcounter,
  MQTT map reporting, troubleshooting and a live web dashboard.
lang: en
url: https://ediblemakerspace.github.io
baseurl: /Meshtastic-sg
repository: EdibleMakerspace/Meshtastic-sg
theme: jekyll-theme-cayman
author: Edible Makerspace
github_username: EdibleMakerspace
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/panel-overview.png
